name: pc
# Pruebas del programa de PC en máquinas Windows y Linux. El código llega cifrado y solo se descifra dentro de cada máquina;
# los resultados salen cifrados. f prepara el paquete; t pasa una tanda por máquina; z apunta la huella de lo ya probado.

on:
  workflow_dispatch:
    inputs:
      a:
        description: a
        required: false
        default: ''
      n:
        description: n
        required: false
        default: ''
  schedule:
    - cron: '5-59/10 * * * *'

permissions:
  contents: read

run-name: ${{ inputs.n || 'pc' }}

concurrency:
  group: ${{ github.event_name == 'schedule' && 'pc-programada' || github.run_id }}
  cancel-in-progress: false

jobs:
  f:
    name: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents: write solo para leer el paquete, que va en un borrador de publicación: GitHub no deja leerlo con read.
    # Este trabajo no ejecuta código de la fábrica: el reparto sale del plan.py de main.
    permissions:
      contents: write
      actions: read
    outputs:
      m: ${{ steps.f.outputs.m }}
      k: ${{ steps.f.outputs.k }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - id: f
        name: preparar el paquete
        shell: bash
        env:
          CLAVE: ${{ secrets.CLAVE }}
          LLAVE: ${{ secrets.LLAVE }}
          RUTA_PRIVADA: ${{ secrets.RUTA_PRIVADA }}
          GH_TOKEN: ${{ github.token }}
          A: ${{ inputs.a }}
        run: bash fuente-pc.sh > /dev/null 2>&1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.f.outputs.m != '[]'
        with:
          name: pc-f
          path: ${{ runner.temp }}/f/p.enc
          retention-days: 1

  t:
    name: tanda ${{ matrix.x.i }}
    needs: f
    if: needs.f.outputs.m != '[]' && needs.f.outputs.m != ''
    runs-on: ${{ matrix.x.so }}
    # La máquina virtual de Windows (tanda vm) instala Windows entero: fuente-pc.sh le da más tiempo, sin pasar del tope de 6 h.
    timeout-minutes: ${{ matrix.x.min || 60 }}
    strategy:
      fail-fast: false
      matrix:
        x: ${{ fromJSON(needs.f.outputs.m) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pc-f
          path: ${{ runner.temp }}/w
      - id: d
        name: abrir el paquete
        shell: bash
        env:
          CLAVE: ${{ secrets.CLAVE }}
          I: ${{ matrix.x.i }}
        run: |
          T=$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")
          w="$T/w"
          { node cifra.cjs d "$w/p.enc" "$w/p.tar" && tar -xf "$w/p.tar" -C "$w" && rm -f "$w/p.enc" "$w/p.tar"; } > /dev/null 2>&1 || exit 0
          # Caché de npm: solo paquetes públicos del registro. La clave es una huella del package-lock, que dice si cambió y no qué lleva.
          # Una rama fabrica/* corre código sin revisar antes de guardarla: guarda la suya aparte y main nunca la abre.
          case $(cat "$w/ci/rama.txt" 2>/dev/null) in fabrica/*) p=fab ;; *) p=main ;; esac
          h=$(tar -xzOf "$w/src.tgz" pc/app/package-lock.json 2>/dev/null | sha256sum | cut -c1-16)
          echo "k=npm-$p-$RUNNER_OS-$h" >> "$GITHUB_OUTPUT"
          echo "p=$p" >> "$GITHUB_OUTPUT"
          # La guarda solo la primera máquina de servidor (Windows) o de app (Linux), para no subirla una vez por máquina.
          read -r tipo _ _ so < <(sed -n "$((I + 1))p" "$w/ci/plan.txt")
          echo "tipo=$tipo" >> "$GITHUB_OUTPUT"
          primera=$(awk -v t="$tipo" -v s="$so" '$1 == t && $4 == s {print NR - 1; exit}' "$w/ci/plan.txt")
          case $tipo in server|app) [ "$primera" = "$I" ] && echo g=1 >> "$GITHUB_OUTPUT" ;; esac
          exit 0
      - id: c
        if: steps.d.outputs.k != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/npmc
            !${{ runner.temp }}/npmc/_logs
          key: ${{ steps.d.outputs.k }}
          # Una rama puede partir de la caché de main; main solo de la suya.
          restore-keys: |
            npm-${{ steps.d.outputs.p }}-${{ runner.os }}-
            npm-main-${{ runner.os }}-
      # Este paso ejecuta el código que se prueba y no recibe la clave en su entorno, pero el proceso de GitHub que la pasó a
      # "abrir el paquete" sigue vivo. En Linux se quitan sudo y docker antes y se exige ptrace_scope 2, para que el código probado no
      # pueda leer la memoria de ese proceso. En Windows la máquina es administradora: por eso las ramas de la fábrica solo van a Linux.
      # Los resultados se cifran con la llave pública resultados.pub y solo el PC puede abrirlos.
      - id: t
        name: pasar la tanda
        shell: bash
        env:
          I: ${{ matrix.x.i }}
          TIPO: ${{ steps.d.outputs.tipo }}
          npm_config_cache: ${{ runner.temp }}/npmc
        run: |
          T=$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")
          o="$T/o"; w="$T/w"; mkdir -p "$o"
          seguro=1
          if [ "$RUNNER_OS" = Linux ] && [ "$TIPO" = vm ]; then
            # Windows en una máquina virtual (pc/ci/vm/vm.sh): QEMU, UEFI, TPM y herramientas de discos de Ubuntu, /dev/kvm abierto,
            # sin el perfil de AppArmor de swtpm y una carpeta con sitio para los discos (en /mnt o, si no cabe, quitando
            # herramientas que la tanda no usa). Se hace con sudo antes de quitarlo y no ejecuta nada del código probado.
            sudo -n env U="$(id -un)" sh -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -q && apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf swtpm genisoimage mtools dosfstools || exit 1
              chmod 666 /dev/kvm || exit 1
              [ -f /etc/apparmor.d/usr.bin.swtpm ] && apparmor_parser -R /etc/apparmor.d/usr.bin.swtpm
              libre=$(df -BG --output=avail /mnt 2>/dev/null | tail -n 1 | tr -dc 0-9)
              if [ "${libre:-0}" -ge 40 ]; then mkdir -p /mnt/vm && chown "$U" /mnt/vm
              else rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL; mkdir -p /vm && chown "$U" /vm; fi
            ' > /dev/null 2>&1 || echo "no se pudo preparar la máquina virtual" >> "$o/error.txt"
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            # Docker también da root (el usuario runner está en su grupo): se para y se cierra su enchufe antes de quitar sudo.
            sudo -n sh -c 'systemctl stop docker.socket docker containerd; rm -f /var/run/docker.sock; echo 2 > /proc/sys/kernel/yama/ptrace_scope; rm -f /etc/sudoers.d/*' > /dev/null 2>&1
            if sudo -n true > /dev/null 2>&1 || docker info > /dev/null 2>&1 || [ "$(cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null || echo 0)" -lt 2 ]; then
              seguro=0; echo "no se pudo quitar sudo" > "$o/error.txt"
            fi
          fi
          {
            [ "$seguro" = 1 ] && [ -f "$w/ci/correr.sh" ] && bash "$w/ci/correr.sh" "$I" "$o"
          } > "$o/salida.log" 2>&1 || echo fallo >> "$o/error.txt"
          rm -rf "$T/npmc/_logs"
          { [ -e "$o/mal" ] || [ -e "$o/error.txt" ]; } && echo mal=1 >> "$GITHUB_OUTPUT"
          tar -cf "$T/r.tar" -C "$o" . > /dev/null 2>&1
          node cifra.cjs p "$T/r.tar" "$T/r.enc" > /dev/null 2>&1
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: r${{ matrix.x.i }}
          path: ${{ runner.temp }}/r.enc
          if-no-files-found: error
          retention-days: 3
      - if: steps.d.outputs.g == '1' && steps.c.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/npmc
            !${{ runner.temp }}/npmc/_logs
          key: ${{ steps.d.outputs.k }}
      - if: steps.t.outputs.mal == '1'
        run: exit 1

  z:
    name: guardar
    needs: [f, t]
    # Solo cuenta como probado si las máquinas acabaron. Un fallo de las pruebas también cuenta, para no repetir cada 10 minutos
    # una rama rota con 22 máquinas; una pasada cancelada o sin máquinas no cuenta.
    if: always() && needs.f.outputs.k != '' && (needs.t.result == 'success' || needs.t.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: guardar la huella
        run: touch "$RUNNER_TEMP/hecho"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/hecho
          key: ${{ needs.f.outputs.k }}
