name: pc
# Pruebas del programa de PC en máquinas Windows y Linux. El código llega cifrado y solo se descifra dentro de cada máquina;
# los resultados salen cifrados. f prepara el paquete; t pasa una tanda por máquina; z apunta la huella de lo ya probado.

on:
  workflow_dispatch:
    inputs:
      a:
        description: a
        required: false
        default: ''
      n:
        description: n
        required: false
        default: ''
  schedule:
    - cron: '5-59/10 * * * *'

permissions:
  contents: read

run-name: ${{ inputs.n || 'pc' }}

concurrency:
  group: ${{ github.event_name == 'schedule' && 'pc-programada' || github.run_id }}
  cancel-in-progress: false

jobs:
  f:
    name: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    outputs:
      m: ${{ steps.f.outputs.m }}
      k: ${{ steps.f.outputs.k }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - id: f
        name: preparar el paquete
        shell: bash
        env:
          CLAVE: ${{ secrets.CLAVE }}
          LLAVE: ${{ secrets.LLAVE }}
          RUTA_PRIVADA: ${{ secrets.RUTA_PRIVADA }}
          GH_TOKEN: ${{ github.token }}
          A: ${{ inputs.a }}
        run: bash fuente-pc.sh > /dev/null 2>&1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.f.outputs.m != '[]'
        with:
          name: pc-f
          path: ${{ runner.temp }}/f/p.enc
          retention-days: 1

  t:
    name: tanda ${{ matrix.x.i }}
    needs: f
    if: needs.f.outputs.m != '[]' && needs.f.outputs.m != ''
    runs-on: ${{ matrix.x.so }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        x: ${{ fromJSON(needs.f.outputs.m) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pc-f
          path: ${{ runner.temp }}/w
      - id: t
        name: pasar la tanda
        shell: bash
        env:
          CLAVE: ${{ secrets.CLAVE }}
          I: ${{ matrix.x.i }}
        run: |
          T=$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")
          o="$T/o"; w="$T/w"; mkdir -p "$o"
          {
            node cifra.cjs d "$w/p.enc" "$w/p.tar" && tar -xf "$w/p.tar" -C "$w" && rm -f "$w/p.enc" "$w/p.tar" &&
            env -u CLAVE bash "$w/ci/correr.sh" "$I" "$o"
          } > "$o/salida.log" 2>&1 || echo fallo > "$o/error.txt"
          { [ -e "$o/mal" ] || [ -e "$o/error.txt" ]; } && echo mal=1 >> "$GITHUB_OUTPUT"
          tar -cf "$T/r.tar" -C "$o" . > /dev/null 2>&1
          node cifra.cjs c "$T/r.tar" "$T/r.enc" > /dev/null 2>&1
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: r${{ matrix.x.i }}
          path: ${{ runner.temp }}/r.enc
          if-no-files-found: ignore
          retention-days: 3
      - if: steps.t.outputs.mal == '1'
        run: exit 1

  z:
    name: guardar
    needs: [f, t]
    if: always() && needs.f.outputs.k != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: guardar la huella
        run: touch "$RUNNER_TEMP/hecho"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/hecho
          key: ${{ needs.f.outputs.k }}
